<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evangelho Místico Cristão – Jon Padilha</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #7a5e28;
    --dark: #050810;
    --dark-2: #0a0d1a;
    --dark-3: #0f1325;
    --text: #d4c5a0;
    --text-dim: #8a7a5a;
    --white: #f5f0e8;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--dark);
    color: var(--text);
    overflow-x: hidden;
    cursor: default;
  }

  /* ── STAR CANVAS ── */
  #star-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* ── PAGES ── */
  .page {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 1;
    animation: fadeIn 0.8s ease forwards;
  }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── NAV BAR ── */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    background: linear-gradient(to bottom, rgba(5,8,16,0.95) 0%, transparent 100%);
    backdrop-filter: blur(4px);
  }
  .navbar-brand {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    cursor: pointer;
  }
  .navbar-brand:hover { color: var(--gold-light); }
  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }
  .nav-links a {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s;
    cursor: pointer;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--gold); }

  /* ── HOME PAGE ── */
  #page-home {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .home-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 50% 30%, rgba(201,168,76,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 100% 60% at 50% 100%, rgba(10,13,26,0.9) 0%, transparent 60%),
      var(--dark-2);
  }

  /* floating orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    animation: orbFloat 8s ease-in-out infinite;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.12), transparent 70%);
    top: -100px; left: 50%;
    transform: translateX(-50%);
    animation-delay: 0s;
  }
  .orb-2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(100,130,220,0.08), transparent 70%);
    bottom: 20%; right: 10%;
    animation-delay: -3s;
  }
  .orb-3 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(201,168,76,0.06), transparent 70%);
    bottom: 30%; left: 5%;
    animation-delay: -5s;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translateY(0) translateX(-50%); }
    50%       { transform: translateY(-30px) translateX(-50%); }
  }
  .orb-2 { animation-name: orbFloat2; }
  .orb-3 { animation-name: orbFloat3; }
  @keyframes orbFloat2 {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-20px); }
  }
  @keyframes orbFloat3 {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(25px); }
  }

  .home-cover-img {
    position: relative;
    width: min(460px, 90vw);
    border-radius: 8px;
    box-shadow:
      0 0 80px rgba(201,168,76,0.2),
      0 0 200px rgba(201,168,76,0.08),
      0 40px 80px rgba(0,0,0,0.7);
    animation: coverPulse 4s ease-in-out infinite;
    margin-bottom: 40px;
    margin-top: 80px;
  }
  @keyframes coverPulse {
    0%, 100% { box-shadow: 0 0 80px rgba(201,168,76,0.2), 0 0 200px rgba(201,168,76,0.08), 0 40px 80px rgba(0,0,0,0.7); }
    50%       { box-shadow: 0 0 120px rgba(201,168,76,0.35), 0 0 280px rgba(201,168,76,0.15), 0 40px 80px rgba(0,0,0,0.7); }
  }

  .home-enter-btn {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dim));
    border: none;
    padding: 18px 56px;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    margin-bottom: 60px;
    text-shadow: none;
  }
  .home-enter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .home-enter-btn:hover::before { transform: translateX(100%); }
  .home-enter-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(201,168,76,0.4);
  }

  /* particle ring around button */
  .btn-wrapper {
    position: relative;
    display: inline-block;
  }
  .btn-ring {
    position: absolute;
    inset: -12px;
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 4px;
    animation: ringPulse 2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%       { opacity: 0.8; transform: scale(1.03); }
  }

  /* ── INTRO PAGE ── */
  #page-intro {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 100px 0 60px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 20%, rgba(201,168,76,0.06), transparent),
      var(--dark-2);
  }
  .intro-img {
    width: min(520px, 92vw);
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(201,168,76,0.15), 0 30px 60px rgba(0,0,0,0.6);
    margin-bottom: 50px;
  }
  .intro-cta-wrapper {
    text-align: center;
    padding: 0 24px;
  }
  .intro-subtitle {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .intro-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 5vw, 36px);
    color: var(--gold-light);
    margin-bottom: 24px;
    line-height: 1.3;
  }
  .read-btn {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    border: none;
    padding: 16px 48px;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    margin-top: 8px;
  }
  .read-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(201,168,76,0.4);
  }

  /* ── CHAPTER PAGES ── */
  .chapter-page {
    min-height: 100vh;
    padding: 100px 0 100px;
    background:
      radial-gradient(ellipse 80% 40% at 50% 10%, rgba(201,168,76,0.05), transparent),
      var(--dark);
  }
  .chapter-img {
    display: block;
    width: min(560px, 94vw);
    margin: 0 auto 60px;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(201,168,76,0.12), 0 30px 60px rgba(0,0,0,0.6);
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 24px 40px;
    flex-wrap: wrap;
  }
  .nav-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid rgba(201,168,76,0.35);
    color: var(--gold);
    padding: 12px 28px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .nav-btn:hover {
    background: rgba(201,168,76,0.1);
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(201,168,76,0.15);
  }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--dark);
    border-color: transparent;
    font-weight: 700;
  }
  .nav-btn.primary:hover {
    box-shadow: 0 6px 24px rgba(201,168,76,0.4);
    transform: translateY(-1px);
  }

  /* progress dots */
  .progress-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 8px 0 24px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold-dim);
    transition: all 0.3s;
    cursor: pointer;
  }
  .dot.active {
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    transform: scale(1.4);
  }

  /* chapter label */
  .chapter-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-transform: uppercase;
    text-align: center;
    padding-top: 16px;
  }

  /* divider */
  .gold-divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 0 auto 24px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  @media (max-width: 480px) {
    .navbar { padding: 12px 16px; }
    .nav-links { gap: 14px; }
    .nav-links a { font-size: 10px; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
  <span class="navbar-brand" onclick="goTo('home')">Emc³</span>
  <ul class="nav-links">
    <li><a onclick="goTo('home')" id="nav-home" class="active">Início</a></li>
    <li><a onclick="goTo('intro')" id="nav-intro">Livro 5</a></li>
    <li><a onclick="goTo('ch1')" id="nav-ch1">Cap. 01</a></li>
    <li><a onclick="goTo('ch2')" id="nav-ch2">Cap. 02</a></li>

    <li><a onclick="goTo('ch4')" id="nav-ch4">Cap. 04</a></li>
  </ul>
</nav>

<!-- ══ PAGE: HOME ══ -->
<div id="page-home" class="page active">
  <div class="home-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <img src="/mnt/user-data/uploads/1000068491.png" class="home-cover-img" alt="Evangelho Místico Cristão">
  <div class="btn-wrapper">
    <div class="btn-ring"></div>
    <button class="home-enter-btn" onclick="goTo('intro')">Entrar</button>
  </div>
</div>

<!-- ══ PAGE: INTRO ══ -->
<div id="page-intro" class="page">
  <img src="/mnt/user-data/uploads/1000068492.png" class="intro-img" alt="Livro 5 - Introdução">
  <div class="intro-cta-wrapper">
    <p class="intro-subtitle">Jon Padilha · Emc³</p>
    <h2 class="intro-title">Nosso Despertar<br>para a Eternidade</h2>

    <div class="btn-wrapper">
      <div class="btn-ring"></div>
      <button class="read-btn" onclick="goTo('ch1')">Ler Agora</button>

  <div class="bottom-nav" style="margin-top:40px;">

<!-- ══ PAGE: CHAPTER 1 ══ -->
<div id="page-ch1" class="page chapter-page">
  <p class="chapter-label">Capítulo 01</p>
  <div class="gold-divider" style="margin-top:12px;"></div>
  <img src="/mnt/user-data/uploads/1000068498.png" class="chapter-img" alt="A Bíblia Mística">

    <div class="dot" onclick="goTo('ch4')"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTo('intro')">← Introdução</button>
    <button class="nav-btn primary" onclick="goTo('ch2')">Próximo →</button>
  </div>
</div>

<!-- ══ PAGE: CHAPTER 2 ══ -->
<div id="page-ch2" class="page chapter-page">
  <p class="chapter-label">Capítulo 02</p>
  <div class="gold-divider" style="margin-top:12px;"></div>
  <img src="/mnt/user-data/uploads/1000068500.png" class="chapter-img" alt="Sonhei com Jacó e José">
  <div class="progress-dots">
    <div class="dot" onclick="goTo('ch1')"></div>
    <div class="dot" onclick="goTo('ch1')"></div>
    <div class="dot active" onclick="goTo('ch2')"></div>
    <div class="dot" onclick="goTo('ch3')"></div>
    <div class="dot" onclick="goTo('ch4')"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTo('ch1')">← Capítulo 01</button>
    <button class="nav-btn primary" onclick="goTo('ch3')">Próximo →</button>
  </div>
</div>

<!-- ══ PAGE: CHAPTER 3 ══ -->
<div id="page-ch3" class="page chapter-page">
  <p class="chapter-label">Capítulo 03</p>
  <div class="gold-divider" style="margin-top:12px;"></div>
  <img src="/mnt/user-data/uploads/1000068501.png" class="chapter-img" alt="Uma Noite Sonhei">
  <div class="progress-dots">
    <div class="dot" onclick="goTo('ch1')"></div>
    <div class="dot" onclick="goTo('ch1')"></div>
    <div class="dot" onclick="goTo('ch2')"></div>
    <div class="dot active" onclick="goTo('ch3')"></div>
    <div class="dot" onclick="goTo('ch4')"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTo('ch2')">← Capítulo 02</button>
    <button class="nav-btn primary" onclick="goTo('ch4')">Próximo →</button>
  </div>
</div>

<!-- ══ PAGE: CHAPTER 4 ══ -->
<div id="page-ch4" class="page chapter-page">
  <p class="chapter-label">Capítulo 04</p>
  <div class="gold-divider" style="margin-top:12px;"></div>
  <img src="/mnt/user-data/uploads/1000068502.png" class="chapter-img" alt="Neville Goddard e os Sonhos de Cristo">
  <div class="progress-dots">
    <div class="dot" onclick="goTo('ch1')"></div>
    <div class="dot" onclick="goTo('ch1')"></div>
    <div class="dot" onclick="goTo('ch2')"></div>
    <div class="dot" onclick="goTo('ch3')"></div>
    <div class="dot active" onclick="goTo('ch4')"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTo('ch3')">← Capítulo 03</button>
    <button class="nav-btn" onclick="goTo('home')">🏠 Início</button>
  </div>
  <p style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--gold-dim);text-align:center;padding:20px 0 40px;">— Fim do Livro 5 —</p>
</div>

<script>
  // ── STAR FIELD ──
  const canvas = document.getElementById('star-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 4000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        alpha: Math.random(),
        speed: Math.random() * 0.004 + 0.001,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const a = 0.3 + 0.5 * Math.sin(s.phase + t * s.speed);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232,201,122,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  initStars();
  requestAnimationFrame(drawStars);
  window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

  // ── PAGE NAVIGATION ──
  const pageMap = {
    home:  'page-home',
    intro: 'page-intro',
    ch1:   'page-ch1',
    ch2:   'page-ch2',
    ch3:   'page-ch3',
    ch4:   'page-ch4',
  };
  const navMap = {
    home:  'nav-home',
    intro: 'nav-intro',
    ch1:   'nav-ch1',
    ch2:   'nav-ch2',
    ch3:   'nav-ch3',
    ch4:   'nav-ch4',
  };

  let current = 'home';

  function goTo(id) {
    // hide current
    document.getElementById(pageMap[current]).classList.remove('active');
    document.getElementById(navMap[current])?.classList.remove('active');

    // show new
    current = id;
    const el = document.getElementById(pageMap[id]);
    el.classList.add('active');
    document.getElementById(navMap[id])?.classList.add('active');

    // scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // keyboard navigation
  document.addEventListener('keydown', e => {
    const order = ['home','intro','ch1','ch2','ch3','ch4'];
    const idx = order.indexOf(current);
    if ((e.key === 'ArrowRight' || e.key === 'ArrowDown') && idx < order.length - 1) goTo(order[idx + 1]);
    if ((e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   && idx > 0)               goTo(order[idx - 1]);
  });
</script>
</body>
</html>
